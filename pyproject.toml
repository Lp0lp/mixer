[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixer"
version = "0.1.0"
description = "Lets see what this ends up being."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Luís Borges Araújo", email = "you@example.com" }]
dependencies = [
  # should probably add the dependencies here hahah
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mixer*"]

[tool.setuptools.package-data]
shaker = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mixer --cov-report=term"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:scikits.*",
]